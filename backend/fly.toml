# Deploy from inside backend/:  fly launch --copy-config --no-deploy && fly deploy
app = "priceverse-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DEMO_MODE = "false"
  DATABASE_URL = "sqlite+aiosqlite:////app/data/prices.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
[[vm]]
  memory = "1gb"
  cpus = 1